<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a14">
<title>DevChazers HQ</title>
<link rel="icon" href="../../logo/logo-icon.svg">
<!-- the classic CMS stylesheet is loaded first so HQ inherits the exact same theme -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../admin.css">
<link rel="stylesheet" href="hq.css">
</head>
<body class="hq">

<!-- demo / offline banner (only shown when Supabase cannot be reached) -->
<div id="modebar" class="hq-modebar" hidden></div>

<!-- ============================ login gate ============================ -->
<div id="gate" class="gate" hidden>
  <div class="box">
    <img src="../../logo/logo-icon.svg" width="52" alt="">
    <h1 style="font-size:19px">DevChazers HQ</h1>
    <p style="font-size:12.5px;color:var(--mut);margin:0">Sign in with the same admin account as the classic CMS.</p>
    <input type="email" id="gem" placeholder="Email" autocomplete="username" inputmode="email">
    <input type="password" id="gpw" placeholder="Password" autocomplete="current-password">
    <button class="btn pri" id="gbtn" type="button">Sign in</button>
    <p id="gmsg" class="msg"></p>
    <a class="lnk" href="../" style="font-size:12px">← Classic CMS login</a>
  </div>
</div>

<!-- ============================== shell =============================== -->
<div id="app" class="hq-app" hidden>
  <header class="hq-top">
    <button type="button" class="hq-iconbtn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <button type="button" class="hq-iconbtn hide-sm" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h9M4 18h16"/><path d="M17 9l3 3-3 3"/></svg>
    </button>
    <a class="hq-brand" href="#/overview"><img src="../../logo/logo-icon.svg" alt=""><span>DEVCHAZERS</span>&nbsp;HQ</a>
    <div class="hq-crumb" id="crumb"></div>
    <div class="spacer"></div>
    <a class="hq-iconbtn hq-bell" id="notifBtn" href="#/notifications" aria-label="Notifications" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      <b id="notif-count" hidden>0</b>
    </a>
    <span class="hq-tips">
      <button type="button" class="hq-iconbtn" id="tipsBtn" aria-label="How HQ works" title="How HQ works">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 113.6 2.2c-.7.4-1.1 1-1.1 1.8v.5M12 17h.01"/></svg>
      </button>
    </span>
    <span id="hq-mode" class="hide-sm"></span>
    <span class="hq-chip hide-sm" id="user-chip" title="Signed in as"></span>
    <a class="btn hide-sm" href="../../" target="_blank" rel="noopener">Website ↗</a>
    <a class="btn" href="../" title="Classic CMS" aria-label="Classic CMS">CMS</a>
    <button type="button" class="hq-iconbtn" id="logoutBtn" aria-label="Sign out" title="Sign out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </header>

  <div class="hq-shell" id="hq-shell">
    <aside class="hq-side" id="hq-side">
      <nav class="hq-nav" id="hq-nav" aria-label="HQ sections"></nav>
      <div class="hq-side-foot">
        <a href="../../" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.4 3.8 5.6 3.8 9S14.5 18.6 12 21c-2.5-2.4-3.8-5.6-3.8-9S9.5 5.4 12 3z"/></svg>
          <span>View website</span>
        </a>
        <a href="../">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></svg>
          <span>Classic CMS</span>
        </a>
        <a href="#/system">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6.5h.01M6 17.5h.01"/></svg>
          <span>System status</span>
        </a>
      </div>
    </aside>

    <main class="hq-main">
      <div id="view"></div>
    </main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script>window.DC_ROOT="../../";</script>
<script src="../../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../js/data-service.js"></script>
<script src="hq-data.js"></script>
<script src="hq-core.js"></script>
<script src="hq-api.js"></script>
<script src="hq-views-home.js"></script>
<script src="hq-views-social.js"></script>
<script src="hq-views-schedule.js"></script>
<script src="hq-views-studio.js?v=20261114"></script>
<script src="hq-views-content.js"></script>
<script src="hq-views-insights.js"></script>
<script src="hq-views-company.js"></script>
<script src="hq-views-stats.js?v=20261114"></script>
<script src="hq-views-ops.js"></script>
<script src="hq-app.js"></script>
</body>
</html>
